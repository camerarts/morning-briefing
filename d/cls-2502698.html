<h1>美股存储股扩大跌幅 闪迪跌6.74%、美光科技跌超4%</h1>
<p>财联社10月12日电，美股存储股盘初普遍下跌，闪迪跌6.74%，镁光ADR跌6.08%，美光科技跌4.31%，SK海力士跌4.09%，希捷科技跌2.85%，西部数据跌2.15%。费城半导体指数跌2.07%。</p>
