<h1>赛力斯：已回购1753.57万股 累计回购金额9.83亿元</h1>
<p>财联社10月12日电，赛力斯(601127.SH)公告称，截至2026年10月12日，公司通过集中竞价交易方式已累计回购股份1753.57万股，占总股本比例约1.01%，回购最高价91元/股，最低价43.99元/股，累计回购金额9.83亿元。本次回购方案预计回购金额10亿元至20亿元，回购股份将用于注销并减少注册资本。</p>
