<h1>美股光通信、存储板块盘前延续跌势 SK海力士跌超5%</h1>
<p>财联社10月13日电，美股光通信、存储板块盘前延续跌势。迈威尔科技跌3%，Coherent、Ciena、康宁跌约2%；SK海力士跌超5%，闪迪跌近4%，美光科技跌超3%。</p>
