<h1>韩国综指收盘跌超5% SK海力士跌超10%</h1>
<p>财联社10月13日电，日经225指数收跌1.82%，报67777.52点；韩国KOSPI指数收跌5.47%，报6035.34点，创8月份以来收盘新低。其中SK海力士跌超10%。</p>
