<h1>纳指小幅低开 存储、光通信板块走弱</h1>
<p>财联社10月12日电，美股三大指数开盘涨跌不一，纳指跌0.05%，道指涨0.17%，标普500指数涨0.03%。存储板块走弱，海力士、闪迪跌超3%，美光科技跌超2%。光通信股开盘普跌，Lumentum跌2.61%，康宁跌1.55%，Coherent跌3.82%。</p>
