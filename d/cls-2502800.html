<h1>俄副总理：俄美已开始就柴油交易谈判</h1>
<p>财联社10月13日电，俄罗斯副总理诺瓦克表示，俄罗斯和美国的企业已开始就柴油供应交易进行谈判。诺瓦克还透露，2026年前9个月，俄罗斯向欧洲供应了价值213亿美元的能源产品。诺瓦克表示，俄罗斯未来可能向全球市场每月供应350万吨柴油，恢复到此前水平。他称，俄增加柴油供应有助于部分平衡全球市场供需。诺瓦克重申，俄国内柴油市场不会因恢复出口受到影响。</p>
