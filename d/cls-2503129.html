<h1>10月13日午间涨停分析</h1>
<p>财联社10月13日电，今日午盘全市场共45股涨停，连板股总数8只，9股封板未遂，封板率为83%（不含ST股、退市股）。焦点股方面，PCB概念股澳弘电子17天10板，传媒板块慈文传媒3连板、新经典3连板，鱼粉概念股百洋股份3连板，大消费板块丽人丽妆3连板。</p>
