<h1>荣丰控股：控股股东将变更为广州昕图 股票明起复牌</h1>
<p>财联社10月12日电，荣丰控股(000668.SZ)公告称，公司控股股东盛世达与广州昕图签署股份转让协议，拟以每股18.63元转让29.99%股份。同时，以本次股份转让实施完成为前提，广州昕图拟发出部分要约收购5.01%股份。交易完成后，公司控股股东将变更为广州昕图，实际控制人变更为陈群萍。公司股票将于10月13日复牌。</p>
