<h1>开盘半小时两市放量超200亿 预计全天成交超1.7万亿</h1>
<p>财联社10月13日电，据财联社盯盘数据显示，开盘半小时，沪深两市成交额突破5500亿，较上一日此时放量超200亿，预计全天成交金额超1.7万亿。</p>
