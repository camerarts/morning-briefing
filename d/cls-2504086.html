<h1>国家统计局：9月CPI环比上涨0.1% 同比上涨0.9%</h1>
<p>财联社10月14日电，国家统计局10月14日发布的数据显示，9月份全国居民消费价格指数CPI环比上涨0.1%，同比上涨0.9%；工业生产者出厂价格指数PPI环比上涨1.2%，同比上涨5%。</p>
